[project]
name = "telegram-reminder-bot"
version = "0.1.0"
description = "Self-hosted Telegram reminder bot with Chinese natural-language time parsing and recurring schedules"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "tytsxai" }]
keywords = [
    "telegram",
    "bot",
    "reminder",
    "scheduler",
    "natural-language",
    "apscheduler",
    "sqlite",
    "self-hosted",
    "提醒",
    "自然语言",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/tytsxai/telegram-reminder-bot"
Repository = "https://github.com/tytsxai/telegram-reminder-bot"
Documentation = "https://github.com/tytsxai/telegram-reminder-bot/tree/main/docs"
Changelog = "https://github.com/tytsxai/telegram-reminder-bot/blob/main/CHANGELOG.md"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
